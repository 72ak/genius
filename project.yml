name: Genius
options:
  bundleIdPrefix: com.akash
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  Genius:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akash.genius
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Genius
schemes:
  Genius:
    build:
      targets:
        Genius: all
    run:
      config: Debug
    archive:
      config: Release
