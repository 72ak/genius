name: Genius
options:
  bundleIdPrefix: com.akash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  swift-llama-cpp:
    url: https://github.com/pgorzelany/swift-llama-cpp.git
    branch: main
targets:
  Genius:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Genius
        CFBundleURLTypes:
          - CFBundleURLName: com.akash.genius
            CFBundleURLSchemes:
              - genius
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Genius listens to nearby conversation so it can answer on your behalf."
        NSSpeechRecognitionUsageDescription: "Genius transcribes speech on-device to work out what to say."
        UIBackgroundModes:
          - audio
    dependencies:
      - package: swift-llama-cpp
        product: SwiftLlama
      - target: GeniusWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akash.genius
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
  GeniusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/ListeningActivity.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Genius Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akash.genius.widgets
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
schemes:
  Genius:
    build:
      targets:
        Genius: all
    run:
      config: Debug
    archive:
      config: Release
