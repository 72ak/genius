name: Genius
options:
  bundleIdPrefix: com.akash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  Genius:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Genius
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Genius listens to nearby conversation so it can answer on your behalf."
        NSSpeechRecognitionUsageDescription: "Genius transcribes speech on-device to work out what to say."
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akash.genius
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
schemes:
  Genius:
    build:
      targets:
        Genius: all
    run:
      config: Debug
    archive:
      config: Release
